<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#B0532F" />
    <title>Межа — прототип</title>
    <style>
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fbf9f4; }
      .boot svg { width: 52px; height: 52px; animation: boot-pulse 1.1s ease-in-out infinite; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.45; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Прелоадер, пока грузится приложение. React заменит его при первом рендере -->
      <div class="boot">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#B0532F" />
          <polygon points="6,6.6 15,6 14.6,14.8 6.3,15.4" fill="#F7EDE0" />
          <polygon points="17,5.9 26,5.4 26,14.2 16.6,14.7" fill="#F7EDE0" fill-opacity="0.5" />
          <polygon points="6.3,17.4 14.5,16.8 14.9,26 6,26" fill="#F7EDE0" fill-opacity="0.5" />
          <polygon points="16.5,16.7 26,16.2 26,26 16.9,26" fill="#7FCB7A" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
